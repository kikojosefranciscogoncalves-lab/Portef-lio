    <main class="grid">

        <div class="work"
            onclick="abrirModal('Trabalhos/NarrativaFinal.jpg','Na criação de uma história composta apenas por seis imagens, sem qualquer texto ou explicação adicional. O principal desafio deste projeto era desenvolver uma narrativa visual em que qualquer uma das imagens pudesse servir como ponto de partida. Ou seja, independentemente da imagem escolhida para começar, o observador conseguiria construir uma sequência lógica e interpretar a história de forma coerente. Este conceito exigia uma grande atenção à composição, à ligação entre as cenas e aos elementos visuais presentes em cada imagem, de modo a garantir continuidade e múltiplas possibilidades de leitura. Assim, o projeto explorava não só a criatividade narrativa, mas também a capacidade de comunicar ideias exclusivamente através da imagem, permitindo diferentes interpretações e percursos dentro da mesma história.')">
            <img src="Trabalhos/NarrativaFinal.jpg">
            <div class="work-info">
                <h3>Narrativa Visual</h3>
            
            </div>
        </div>

        <div class="work"
            onclick="abrirModal('Trabalhos/IlustraçaoPublicidade.png','Uma ilustração elegante e descontraída que retrata um homem sofisticado num bar tropical à beira-mar, segurando um copo de whiskey enquanto aprecia o ambiente luxuoso e relaxante. A composição mistura tons suaves e traços artísticos com uma estética moderna e premium, transmitindo exclusividade, tranquilidade e prazer. A garrafa em destaque reforça a ideia de uma bebida refinada, perfeita para momentos de lazer e sofisticação. Ideal para promover uma marca de whiskey associada a lifestyle, férias de luxo e experiências únicas.')">
            <img src="Trabalhos/IlustraçaoPublicidade.png">
            <div class="work-info">
                <h3>Ilustração Publicitária</h3>
            </div>
        </div>

        <div class="work"
            onclick="abrirModal('Trabalhos/mockupcatrinas.png','A partir do cartaz desenvolvido para o “Dia das Catrinas”, foi criada uma aplicação tridimensional da identidade visual, transformando o conceito gráfico num objeto funcional: uma tote bag. O objetivo foi transportar os elementos principais do cartaz temos uma tipografia expressiva, cores vibrantes e referências musicais e festivas, para um suporte físico, mantendo a coerência visual da marca/evento. A tote bag funciona como extensão da comunicação do cartaz, reforçando a identidade do evento de forma prática, contemporânea e visualmente apelativa. A adaptação para 3D permitiu explorar a presença da marca no quotidiano, criando um objeto promocional que combina design, utilidade e impacto visual.')">
            <img src="Trabalhos/catrinas.png">
            <div class="work-info">
                <h3>Cartaz</h3>
            </div>
        </div>
        <div class="work"
            onclick="abrirModal('Trabalhos/Caixa-02.jpg','Projeto de narrativa visual e composição gráfica.')">
            <img src="Trabalhos/Caixa-02.jpg">
            <div class="work-info">
                <h3>Modelo de Caixa</h3>
            </div>
        </div>

        <div class="work"
            onclick="abrirModal('Trabalhos/rastro.png','Este trabalho explora uma composição abstrata e expressiva através da sobreposição de manchas, texturas e gestos livres. A combinação das cores azul, vermelho e preto cria contraste e intensidade visual, transmitindo movimento e emoção. A palavra “Rastro” surge como elemento central da obra, simbolizando marcas, memórias e vestígios deixados pelo tempo e pelas experiências. As diferentes camadas e formas criam uma sensação de caos e liberdade criativa, aproximando o trabalho de uma estética experimental e contemporânea.')">
            <img src="Trabalhos/rastro.png">
            <div class="work-info">
                <h3>Tipografia ligado ao desenhado</h3>
            </div>

        </div>

        <div class="work" onclick="abrirModal('Trabalhos/abecedário.png','Este trabalho consiste na criação de um abecedário visual através da observação da cidade e dos seus elementos arquitetónicos. As letras foram encontradas em estruturas, objetos e formas urbanas, explorando linhas, sombras e composições presentes no espaço urbano. A utilização do vermelho e azul cria contraste e unidade visual entre as imagens, destacando as formas tipográficas encontradas naturalmente na arquitetura. O projeto procura mostrar como a tipografia pode existir para além das letras desenhadas, surgindo de forma espontânea no ambiente que nos rodeia.')">
            <img src="Trabalhos/abecedário.png">
            <div class="work-info">
                <h3>Criação de Abecedário</h3>
            </div>
        </div>

        <div class="work" onclick="abrirModal('Trabalhos/humbertodelagado.png','Este cartaz foi desenvolvido com inspiração no trabalho de Alexander Rodchenko, um dos principais artistas do construtivismo russo. O objetivo do projeto foi criar uma composição gráfica que transmitisse impacto visual, propaganda e dinamismo, características muito presentes nas obras de Rodchenko. Para a realização do cartaz, utilizei uma fotografia em preto e branco de uma multidão e de uma figura central com os braços erguidos, criando uma sensação de liderança, força e mobilização coletiva. A escolha das imagens remete à estética política e social usada pelo artista nas suas composições. Na tipografia, optei por letras grandes, geométricas e fortes, ocupando grande parte da composição, reforçando a influência construtivista e a comunicação direta. As cores neutras e o contraste entre preto, branco e tons bege ajudam a destacar os elementos principais e mantêm uma aparência vintage e industrial. A organização visual foi pensada para criar profundidade e hierarquia, colocando a personagem principal em destaque acima da multidão, simbolizando poder e influência. Além disso, a composição utiliza enquadramentos e sobreposições típicas do design gráfico de propaganda soviética, referência marcante no trabalho de Rodchenko. Com este trabalho procurei reinterpretar a linguagem visual construtivista de forma contemporânea, explorando composição, contraste, escala e impacto visual para criar um cartaz expressivo e comunicativo')">
            <img src="Trabalhos/humbertodelagado.png">
            <div class="work-info">
                <h3>Cartaz com inspiração a Rodchenko</h3>
            </div>
        </div>

        <div class="work" onclick="abrirModal('Trabalhos/capadelivro.png','Esta capa editorial foi desenvolvida com uma abordagem minimalista e conceptual, inspirada na mensagem crítica e social do livro Design for the Real World, de Victor Papanek. A composição utiliza apenas preto, branco e vermelho para criar um forte impacto visual e transmitir uma sensação de urgência e contestação. O elemento gráfico principal é o grande traço vermelho em forma de “X”, que atravessa a frente e a contracapa, simbolizando crítica, rutura e rejeição de práticas de design irresponsáveis. A textura irregular do traço dá dinamismo à composição e reforça a ideia de protesto e intervenção social. A tipografia bold em caixa alta cria contraste e destaca o título de forma clara e direta, transmitindo força e autoridade. A organização dos elementos foi pensada para manter equilíbrio visual, utilizando bastante espaço vazio para valorizar a mensagem e tornar a capa mais limpa e moderna. Na contracapa, a citação escolhida introduz o pensamento provocador de Papanek e complementa o conceito visual da capa. A continuidade gráfica entre frente, lombada e verso cria unidade e torna o livro visualmente coerente. O resultado final é uma capa contemporânea, expressiva e conceptual, que representa os temas principais da obra: a responsabilidade social do design, a crítica ao consumismo e a importância de criar para as reais necessidades da sociedade.')">

            <img src="Trabalhos/capadelivro.png">

            <div class="work-info">
                <h3>Cartaz de um Livro</h3>
            </div>
        </div>
